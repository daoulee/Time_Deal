<!DOCTYPE html>
<html lang="ko">
  <head>
    <!--
      타임딜 Vite 앱의 HTML 진입 문서로 SEO·공유 메타데이터와 React 마운트 지점을 제공합니다.
      main.tsx와 prerender 스크립트가 이 구조를 소비하므로 doctype·charset·JSON-LD 치환 규약을 유지합니다.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff5722" />
    <script>
      // 휴대폰으로 들어오면 타임딜 모바일 앱(PWA, timedeal-mobile.netlify.app)으로 보냅니다. 판매자·관리자·결제·인증 화면은 웹에 남깁니다.
      // ?view=pc / ?view=app 으로 선택을 바꿀 수 있고 그 선택은 기기에 기억됩니다.
      (function () {
        try {
          if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
          var q = new URLSearchParams(location.search).get("view");
          if (q === "app" || q === "pc") localStorage.setItem("td_view", q);
          var pref = localStorage.getItem("td_view");
          var mobile = /Android|iPhone|iPod|iPad|Mobile/i.test(navigator.userAgent) || matchMedia("(pointer: coarse)").matches;
          var webOnly = /^\/(seller|admin|payments|auth)(\/|-|$)/.test(location.pathname);
          if (!webOnly && pref !== "pc" && (pref === "app" || mobile)) location.replace("https://timedeal-mobile.netlify.app/" + (pref === "app" ? "?view=app" : ""));
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>타임딜 | 이웃과 함께하는 시간 한정 공동구매</title>
    <meta name="description" content="타임딜은 동네 이웃과 함께 목표 인원을 모아 생활 상품을 합리적인 가격에 구매하는 시간 한정 공동구매 서비스입니다." />
    <meta property="og:title" content="타임딜 | 이웃과 함께하는 시간 한정 공동구매" />
    <meta property="og:description" content="마감 시간과 참여 현황을 확인하고 이웃과 함께 타임딜에 참여해 보세요." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="타임딜 | 이웃과 함께하는 시간 한정 공동구매" />
    <meta name="twitter:description" content="마감 시간과 참여 현황을 확인하고 이웃과 함께 타임딜에 참여해 보세요." />
    <script id="structured-data-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "타임딜",
        "description": "동네 이웃과 함께 목표 인원을 모아 생활 상품을 합리적인 가격에 구매하는 시간 한정 공동구매 서비스",
        "url": "__SITE_URL__"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
